<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Katkı Animasyonu</title>
<style>
  :root {
    --bg: #f6f8fa; --card: #ffffff; --border: #d0d7de; --fg: #1f2328; --muted: #656d76;
    --l0: #ebedf0; --l1: #9be9a8; --l2: #40c463; --l3: #30a14e; --l4: #216e39; --hi: #39d353;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #010409; --card: #0d1117; --border: #30363d; --fg: #e6edf3; --muted: #8b949e;
      --l0: #161b22; --l1: #0e4429; --l2: #006d32; --l3: #26a641; --l4: #39d353; --hi: #aff5b4;
    }
  }
  :root[data-theme="dark"] {
    --bg: #010409; --card: #0d1117; --border: #30363d; --fg: #e6edf3; --muted: #8b949e;
    --l0: #161b22; --l1: #0e4429; --l2: #006d32; --l3: #26a641; --l4: #39d353; --hi: #aff5b4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1120px; margin: 0 auto; padding: 40px 16px 64px; }
  header { margin-bottom: 28px; }
  header h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); }
  header a { color: inherit; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px 16px; min-width: 0;
  }
  .card.wide { grid-column: 1 / -1; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .card-head h2 { font-size: 14px; margin: 0; font-weight: 600; }
  .card-head span { color: var(--muted); font-size: 12px; }
  .replay {
    font: inherit; font-size: 12px; color: var(--muted); background: transparent;
    border: 1px solid var(--border); border-radius: 6px; padding: 2px 10px; cursor: pointer; flex: none;
  }
  .replay:hover { color: var(--fg); }
  .wrap { position: relative; }
  canvas { display: block; width: 100%; }
  .tip {
    position: absolute; pointer-events: none; white-space: nowrap; font-size: 12px;
    background: var(--fg); color: var(--card); padding: 3px 8px; border-radius: 6px;
    transform: translate(-50%, -100%); opacity: 0; transition: opacity .1s;
  }
  @media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title"></h1>
    <p id="sub"></p>
  </header>
  <div class="grid">
    <section class="card wide" id="c-grid">
      <div class="card-head"><div><h2>Izgara</h2><span>Günler çapraz bir dalgayla yerine oturur</span></div><button class="replay">Tekrar</button></div>
      <div class="wrap"><canvas style="height:190px"></canvas><div class="tip"></div></div>
    </section>
    <section class="card wide" id="c-sky">
      <div class="card-head"><div><h2>Silüet</h2><span>Her gün bir bina, yükseklik katkıya göre</span></div><button class="replay">Tekrar</button></div>
      <div class="wrap"><canvas style="height:300px"></canvas></div>
    </section>
    <section class="card" id="c-pulse">
      <div class="card-head"><div><h2>Haftalık nabız</h2><span>Haftalık toplamlar, sonra günler düşer</span></div><button class="replay">Tekrar</button></div>
      <div class="wrap"><canvas style="height:300px"></canvas></div>
    </section>
    <section class="card" id="c-ring">
      <div class="card-head"><div><h2>Halka</h2><span>7 halka = haftanın günleri</span></div><button class="replay">Tekrar</button></div>
      <div class="wrap"><canvas style="height:300px"></canvas></div>
    </section>
    <section class="card" id="c-streak">
      <div class="card-head"><div><h2>Seri</h2><span>Kesintisiz günler</span></div><button class="replay">Tekrar</button></div>
      <div class="wrap"><canvas style="height:210px"></canvas></div>
    </section>
    <section class="card" id="c-term">
      <div class="card-head"><div><h2>Terminal</h2><span>Aktivite, ASCII olarak</span></div><button class="replay">Tekrar</button></div>
      <div class="wrap"><canvas style="height:210px"></canvas></div>
    </section>
  </div>
</main>
<script>
const D = __DATA__;

// ---------- data ----------
const START = new Date(D.start + 'T00:00:00Z');
const OFF = START.getUTCDay();
const DAYS = D.counts.map((count, i) => {
  const date = new Date(START); date.setUTCDate(date.getUTCDate() + i);
  return { i, date, count, level: +D.levels[i], col: Math.floor((i + OFF) / 7), row: (i + OFF) % 7 };
});
const NCOLS = DAYS[DAYS.length - 1].col + 1;
const SUM = D.counts.reduce((a, b) => a + b, 0) || 1;
const MAX = Math.max(1, ...D.counts);
const GRID = Array.from({ length: NCOLS }, () => Array(7).fill(null));
DAYS.forEach(d => { GRID[d.col][d.row] = d; });
const BEST = DAYS.reduce((a, b) => (b.count > a.count ? b : a));
const WEEKS = GRID.map(col => col.reduce((s, d) => s + (d ? d.count : 0), 0));
const fmtDate = d => d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
const fmtNum = n => n.toLocaleString('tr-TR');

document.getElementById('title').textContent = '@' + D.user;
document.getElementById('sub').innerHTML =
  `Son bir yılda <b>${fmtNum(D.total)}</b> katkı · <a href="https://github.com/${D.user}">github.com/${D.user}</a>`;

// ---------- helpers ----------
const clamp = x => (x < 0 ? 0 : x > 1 ? 1 : x);
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeInOutCubic = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const hex = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };
const shade = (c, amt) => mix(c, amt > 0 ? '#ffffff' : '#000000', Math.abs(amt));
const SANS = 'ui-sans-serif, system-ui, -apple-system, sans-serif';
const MONO = 'ui-monospace, SFMono-Regular, Menlo, monospace';

let P;
function readPalette() {
  const s = getComputedStyle(document.documentElement), v = n => s.getPropertyValue(n).trim();
  P = { lv: [0, 1, 2, 3, 4].map(i => v('--l' + i)), hi: v('--hi'), fg: v('--fg'), muted: v('--muted'), card: v('--card'), border: v('--border') };
}
readPalette();

function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, Math.min(r, w / 2, h / 2)); else ctx.rect(x, y, w, h);
  ctx.fill();
}

// Shared GitHub-style grid geometry
function gridLayout(w, h, padT) {
  const padL = 30, padR = 4, padB = 4;
  const cell = Math.min((w - padL - padR) / NCOLS, (h - padT - padB) / 7);
  const gap = Math.max(1, cell * 0.2);
  const x0 = padL + (w - padL - padR - cell * NCOLS) / 2;
  return { cell, gap, size: cell - gap, x0, y0: padT,
    x: c => x0 + c * cell, y: r => padT + r * cell };
}
function drawAxisLabels(ctx, L) {
  ctx.fillStyle = P.muted; ctx.font = `11px ${SANS}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  [['Pzt', 1], ['Çar', 3], ['Cum', 5]].forEach(([n, r]) => ctx.fillText(n, L.x0 - 30, L.y(r) + L.size / 2));
  let lastX = -99;
  DAYS.forEach(d => {
    if (d.date.getUTCDate() !== 1) return;
    const x = L.x(d.col);
    if (x - lastX < 28) return;
    ctx.fillText(d.date.toLocaleDateString('tr-TR', { month: 'short', timeZone: 'UTC' }), x, L.y0 - 9);
    lastX = x;
  });
}

// ---------- playback ----------
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const mounted = [];
// fit(width) -> canvas height, for canvases whose content scales with width
function mount(id, draw, duration, setup, fit) {
  const card = document.getElementById(id), canvas = card.querySelector('canvas'), ctx = canvas.getContext('2d');
  const st = { w: 0, h: 0, start: null, visible: false, raf: 0, card, canvas };
  const render = now => {
    const t = reduced.matches ? Infinity : st.start == null ? 0 : now - st.start;
    ctx.clearRect(0, 0, st.w, st.h);
    draw(ctx, st.w, st.h, t, st);
    return t;
  };
  const frame = now => {
    st.raf = 0;
    const t = render(now);
    if (st.visible && t < duration) st.raf = requestAnimationFrame(frame);
  };
  const kick = () => { if (!st.raf) st.raf = requestAnimationFrame(frame); };
  st.redraw = () => render(performance.now());
  new ResizeObserver(() => {
    if (fit) canvas.style.height = Math.round(fit(canvas.getBoundingClientRect().width)) + 'px';
    const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    st.w = r.width; st.h = r.height;
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    st.redraw();
  }).observe(canvas);
  new IntersectionObserver(([e]) => {
    st.visible = e.isIntersecting;
    if (st.visible) { if (st.start == null) st.start = performance.now(); kick(); }
    else if (st.raf) { cancelAnimationFrame(st.raf); st.raf = 0; }
  }, { threshold: 0.4 }).observe(canvas);
  card.querySelector('.replay').addEventListener('click', () => { st.start = performance.now(); kick(); });
  if (setup) setup(st);
  mounted.push(st);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readPalette(); mounted.forEach(s => s.redraw()); });

// ---------- 1. grid ----------
mount('c-grid', (ctx, w, h, t, st) => {
  const L = gridLayout(w, h, 44);
  drawAxisLabels(ctx, L);
  let running = 0;
  for (const d of DAYS) {
    const p = clamp((t - (d.col + d.row) * 14) / 450);
    if (p <= 0) continue;
    running += d.count;
    const s = L.size * easeOutBack(p);
    ctx.fillStyle = mix(P.hi, P.lv[d.level], clamp(p * 1.3));
    rr(ctx, L.x(d.col) + (L.size - s) / 2, L.y(d.row) + (L.size - s) / 2, s, s, 2);
  }
  // Daily counts don't always sum to GitHub's total, so scale onto it
  const shown = Math.round(running * D.total / SUM);
  ctx.fillStyle = P.fg; ctx.font = `600 20px ${SANS}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(fmtNum(shown), L.x0, 18);
  const nw = ctx.measureText(fmtNum(shown)).width;
  ctx.fillStyle = P.muted; ctx.font = `12px ${SANS}`; ctx.fillText('katkı', L.x0 + nw + 6, 18);
  if (st.hover) {
    ctx.strokeStyle = P.fg; ctx.lineWidth = 1.5;
    ctx.strokeRect(L.x(st.hover.col) - 0.5, L.y(st.hover.row) - 0.5, L.size + 1, L.size + 1);
  }
}, 2000, st => {
  const tip = st.card.querySelector('.tip');
  st.canvas.addEventListener('mousemove', e => {
    const r = st.canvas.getBoundingClientRect(), L = gridLayout(st.w, st.h, 44);
    const c = Math.floor((e.clientX - r.left - L.x0) / L.cell), row = Math.floor((e.clientY - r.top - L.y0) / L.cell);
    const d = c >= 0 && c < NCOLS && row >= 0 && row < 7 ? GRID[c][row] : null;
    if (d !== st.hover) { st.hover = d; st.redraw(); }
    if (!d) { tip.style.opacity = 0; return; }
    tip.textContent = `${d.count} katkı · ${fmtDate(d.date)}`;
    tip.style.left = Math.min(Math.max(L.x(d.col) + L.size / 2, 70), st.w - 70) + 'px';
    tip.style.top = L.y(d.row) - 4 + 'px';
    tip.style.opacity = 1;
  });
  st.canvas.addEventListener('mouseleave', () => { st.hover = null; tip.style.opacity = 0; st.redraw(); });
}, w => 44 + 7 * Math.min(20, (w - 34) / NCOLS) + 6);

// ---------- 2. skyline ----------
mount('c-sky', (ctx, w, h, t) => {
  const cw = (w - 24) / (NCOLS + 4.2), dx = cw * 0.6, dy = cw * 0.45;
  const baseY = h - 12, x0 = 12, maxH = h * 0.58, sq = Math.sqrt(MAX);
  let bestTop = null;
  // Far rows first so nearer rows paint over them
  for (let r = 6; r >= 0; r--) for (let c = 0; c < NCOLS; c++) {
    const d = GRID[c][r]; if (!d) continue;
    const p = easeOutCubic(clamp((t - c * 24 - (6 - r) * 30) / 700));
    const bx = x0 + c * cw + r * dx, by = baseY - r * dy, bw = cw * 0.86;
    const H = d.count ? Math.max(2, maxH * Math.sqrt(d.count) / sq * p) : 0;
    const base = P.lv[d.level];
    if (H > 0) {
      ctx.fillStyle = shade(base, -0.18);
      ctx.beginPath(); ctx.moveTo(bx + bw, by); ctx.lineTo(bx + bw + dx, by - dy); ctx.lineTo(bx + bw + dx, by - dy - H); ctx.lineTo(bx + bw, by - H); ctx.fill();
      ctx.fillStyle = base; ctx.fillRect(bx, by - H, bw, H);
    }
    ctx.fillStyle = H > 0 ? shade(base, 0.22) : base;
    ctx.beginPath(); ctx.moveTo(bx, by - H); ctx.lineTo(bx + bw, by - H); ctx.lineTo(bx + bw + dx, by - H - dy); ctx.lineTo(bx + dx, by - H - dy); ctx.fill();
    if (d === BEST) bestTop = [bx + (bw + dx) / 2, by - H - dy / 2];
  }
  const a = clamp((t - 2200) / 400);
  if (a > 0 && bestTop) {
    const [px, py] = bestTop, ly = 22, right = px > w / 2;
    ctx.globalAlpha = a; ctx.strokeStyle = P.muted; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px, py - 3); ctx.lineTo(px, ly); ctx.lineTo(px + (right ? -10 : 10), ly); ctx.stroke();
    ctx.fillStyle = P.fg; ctx.font = `12px ${SANS}`; ctx.textBaseline = 'middle'; ctx.textAlign = right ? 'right' : 'left';
    ctx.fillText(`En iyi gün · ${fmtDate(BEST.date)} · ${BEST.count} katkı`, px + (right ? -14 : 14), ly);
    ctx.globalAlpha = 1;
  }
}, 2700);

// ---------- 3. weekly pulse ----------
const PULSE_LINE = 1800;
mount('c-pulse', (ctx, w, h, t) => {
  const pad = 12, cell = Math.min((w - 2 * pad) / NCOLS, h * 0.42 / 7), size = cell - Math.max(1, cell * 0.2);
  const gx0 = (w - cell * NCOLS) / 2, gy0 = h - 4 - cell * 7;
  const top = 28, bot = gy0 - 24, wmax = Math.max(1, ...WEEKS);
  const px = c => gx0 + c * cell + size / 2, py = c => bot - (bot - top) * WEEKS[c] / wmax;
  const lp = easeInOutCubic(clamp(t / PULSE_LINE)) * (NCOLS - 1);
  const k = Math.floor(lp), f = lp - k;
  const dotX = k < NCOLS - 1 ? px(k) + (px(k + 1) - px(k)) * f : px(k);
  const dotY = k < NCOLS - 1 ? py(k) + (py(k + 1) - py(k)) * f : py(k);
  ctx.beginPath(); ctx.moveTo(px(0), bot);
  for (let c = 0; c <= k; c++) ctx.lineTo(px(c), py(c));
  ctx.lineTo(dotX, dotY); ctx.lineTo(dotX, bot); ctx.closePath();
  ctx.fillStyle = P.lv[1]; ctx.globalAlpha = 0.45; ctx.fill(); ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.moveTo(px(0), py(0));
  for (let c = 1; c <= k; c++) ctx.lineTo(px(c), py(c));
  ctx.lineTo(dotX, dotY);
  ctx.strokeStyle = P.lv[3]; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
  if (t < PULSE_LINE + 600) {
    ctx.globalAlpha = 1 - clamp((t - PULSE_LINE) / 600);
    ctx.fillStyle = P.hi; ctx.beginPath(); ctx.arc(dotX, dotY, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = P.muted; ctx.font = `12px ${SANS}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(`Haftalık zirve: ${wmax} katkı`, pad, 14);
  for (const d of DAYS) {
    const p = clamp((t - PULSE_LINE - d.col * 28 - d.row * 40) / 520);
    if (p <= 0) continue;
    const ty = gy0 + d.row * cell, y = py(d.col) + (ty - py(d.col)) * easeOutCubic(p);
    ctx.fillStyle = mix(P.hi, P.lv[d.level], p);
    rr(ctx, gx0 + d.col * cell, y, size, size, 1.5);
  }
}, PULSE_LINE + NCOLS * 28 + 6 * 40 + 600);

// ---------- 4. ring ----------
mount('c-ring', (ctx, w, h, t) => {
  const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 10, r0 = R * 0.4, band = (R - r0) / 7;
  const step = Math.PI * 2 / NCOLS, A0 = -Math.PI / 2;
  const prog = easeInOutCubic(clamp(t / 2600)), hand = A0 + prog * Math.PI * 2;
  for (const d of DAYS) {
    const a0 = A0 + d.col * step + step * 0.08, a1 = a0 + step * 0.84;
    const p = prog >= 1 ? 1 : clamp((hand - a0) / (step * 4));
    if (p <= 0) continue;
    const ri = r0 + d.row * band + 0.6, ro = ri + band - 1.2;
    ctx.fillStyle = mix(P.hi, P.lv[d.level], p);
    ctx.beginPath(); ctx.arc(cx, cy, ro, a0, a1); ctx.arc(cx, cy, ri, a1, a0, true); ctx.closePath(); ctx.fill();
  }
  const ha = 1 - clamp((t - 2600) / 400);
  if (ha > 0) {
    ctx.globalAlpha = ha; ctx.strokeStyle = P.fg; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(hand) * r0 * 0.85, cy + Math.sin(hand) * r0 * 0.85);
    ctx.lineTo(cx + Math.cos(hand) * (R + 4), cy + Math.sin(hand) * (R + 4)); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  const shown = Math.round(D.total * prog);
  ctx.fillStyle = P.fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `600 ${Math.round(r0 * 0.42)}px ${SANS}`; ctx.fillText(fmtNum(shown), cx, cy - 4);
  ctx.fillStyle = P.muted; ctx.font = `11px ${SANS}`; ctx.fillText('katkı', cx, cy + r0 * 0.32);
}, 3000);

// ---------- 5. streak ----------
const STREAK = (() => {
  let last = DAYS.length - 1;
  if (DAYS[last].count === 0) last--; // today not done yet doesn't break the streak
  let s = last; while (s >= 0 && DAYS[s].count > 0) s--;
  const current = { from: s + 1, to: last, len: last - s };
  let best = { from: 0, to: -1, len: 0 }, run = 0;
  DAYS.forEach((d, i) => { if (d.count > 0) { run++; if (run > best.len) best = { from: i - run + 1, to: i, len: run }; } else run = 0; });
  const useCurrent = current.len >= 2;
  const trace = useCurrent ? current : best;
  const brk = useCurrent ? trace.from - 1 : trace.to + 1;
  const stepMs = trace.len ? Math.min(90, 2600 / trace.len) : 0;
  return { current, best, trace, brk: DAYS[brk] || null, stepMs, end: 300 + trace.len * stepMs };
})();
mount('c-streak', (ctx, w, h, t) => {
  const L = gridLayout(w, h, 40), S = STREAK, tr = S.trace;
  drawAxisLabels(ctx, L);
  const k = tr.len ? Math.min(tr.len - 1, Math.max(-1, (t - 300) / S.stepMs)) : -1;
  ctx.globalAlpha = 0.3;
  for (const d of DAYS) { ctx.fillStyle = P.lv[d.level]; rr(ctx, L.x(d.col), L.y(d.row), L.size, L.size, 2); }
  ctx.globalAlpha = 1;
  for (let i = 0; i <= Math.floor(k); i++) {
    const d = DAYS[tr.from + i]; ctx.fillStyle = P.lv[Math.max(2, d.level)];
    rr(ctx, L.x(d.col), L.y(d.row), L.size, L.size, 2);
  }
  const center = i => { const d = DAYS[tr.from + i]; return [L.x(d.col) + L.size / 2, L.y(d.row) + L.size / 2]; };
  const at = x => { const i = Math.floor(x), f = x - i, a = center(i), b = i + 1 < tr.len ? center(i + 1) : a; return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]; };
  if (k >= 0 && t < S.end + 800) {
    const fade = 1 - clamp((t - S.end) / 800);
    for (let j = 8; j >= 0; j--) {
      const x = k - j * 0.5; if (x < 0) continue;
      const [x1, y1] = at(x);
      ctx.globalAlpha = fade * (1 - j / 9) * 0.9; ctx.fillStyle = P.hi;
      ctx.beginPath(); ctx.arc(x1, y1, Math.max(1.5, L.size * 0.45 * (1 - j / 12)), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  const ma = clamp((t - S.end) / 300);
  if (ma > 0 && S.brk) {
    const x = L.x(S.brk.col), y = L.y(S.brk.row), s = L.size;
    ctx.globalAlpha = ma; ctx.strokeStyle = '#f85149'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + s, y + s); ctx.moveTo(x + s, y); ctx.lineTo(x, y + s); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = P.fg; ctx.font = `600 13px ${SANS}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const n = tr.len ? Math.max(0, Math.floor(k) + 1) : 0;
  const label = S.trace === S.current ? `Güncel seri: ${n} gün` : `En uzun seri: ${n} gün`;
  ctx.fillText(label, L.x0, 14);
  const lw = ctx.measureText(label).width;
  ctx.fillStyle = P.muted; ctx.font = `12px ${SANS}`;
  ctx.fillText(S.trace === S.current ? `· en uzun ${S.best.len} gün` : `· güncel ${S.current.len} gün`, L.x0 + lw + 6, 14);
}, STREAK.end + 900, null, w => 40 + 7 * Math.min(20, (w - 34) / NCOLS) + 6);

// ---------- 6. terminal ----------
const CMD = `$ gh contributions ${D.user} --last-year`;
const TYPE_MS = 32, T_OUT = 200 + CMD.length * TYPE_MS + 250;
const GLYPHS = '.:+#@', NOISE = '!<>-_\\/[]{}=+*^?#%&$';
mount('c-term', (ctx, w, h, t) => {
  const pad = 12, cw = Math.min((w - 2 * pad) / NCOLS, 8.4), fs = cw / 0.6, lh = fs * 1.2;
  const x0 = (w - cw * NCOLS) / 2;
  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.font = `${Math.min(13, Math.max(10, fs))}px ${MONO}`; ctx.fillStyle = P.fg;
  const typed = CMD.slice(0, Math.max(0, Math.floor((t - 200) / TYPE_MS)));
  ctx.fillText(typed, x0, 10);
  if (typed.length < CMD.length) { ctx.fillStyle = P.hi; ctx.fillRect(x0 + ctx.measureText(typed).width + 1, 10, 7, 14); }
  ctx.font = `${fs}px ${MONO}`;
  const gy = 36;
  let settledAll = true;
  for (const d of DAYS) {
    const settle = T_OUT + d.col * 18 + d.row * 25;
    if (t < settle - 350) { settledAll = false; continue; }
    const done = t >= settle;
    if (!done) settledAll = false;
    ctx.fillStyle = done ? (d.level ? P.lv[Math.max(2, d.level)] : P.muted) : P.muted;
    ctx.fillText(done ? GLYPHS[d.level] : NOISE[(Math.random() * NOISE.length) | 0], x0 + d.col * cw, gy + d.row * lh);
  }
  if (settledAll) {
    const a = clamp((t - (T_OUT + NCOLS * 18 + 6 * 25)) / 400);
    ctx.globalAlpha = a; ctx.font = `${Math.min(13, Math.max(10, fs))}px ${MONO}`;
    const y = gy + 7 * lh + 10;
    ctx.fillStyle = P.muted; ctx.fillText(`→ ${fmtNum(D.total)} katkı · zirve ${BEST.count}/gün · `, x0, y);
    const pre = ctx.measureText(`→ ${fmtNum(D.total)} katkı · zirve ${BEST.count}/gün · `).width;
    ctx.fillStyle = P.fg; ctx.fillText(GLYPHS.split('').join(' '), x0 + pre, y);
    ctx.fillStyle = P.hi; ctx.fillRect(x0, y + 20, 7, 14);
    ctx.globalAlpha = 1;
  }
}, T_OUT + NCOLS * 18 + 6 * 25 + 500, null, w => 36 + 7 * 1.2 * Math.min((w - 24) / NCOLS, 8.4) / 0.6 + 52);
</script>
