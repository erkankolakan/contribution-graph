<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 156" width="900" height="156" role="img" aria-label="GitHub stats and most used languages">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}.m{fill:#8b949e}.a{fill:#3fb950}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.u{opacity:0;animation:up .7s cubic-bezier(.22,1,.36,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.u,.g,.c{animation:none;opacity:1;transform:none}}
.g{transform-box:fill-box;transform-origin:0 50%;animation:grow .8s cubic-bezier(.22,1,.36,1) both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
<g class="u" style="animation-delay:0.00s"><text x="0" y="42" font-size="40" font-weight="700" letter-spacing="-0.8">44</text><text class="m" x="0" y="68" font-size="16">best day</text></g><g class="u" style="animation-delay:0.10s"><text x="225" y="42" font-size="40" font-weight="700" letter-spacing="-0.8">15</text><text class="m" x="225" y="68" font-size="16">longest streak, days</text></g><g class="u" style="animation-delay:0.20s"><text x="450" y="42" font-size="40" font-weight="700" letter-spacing="-0.8">4</text><text class="m" x="450" y="68" font-size="16">current streak, days</text></g><g class="u" style="animation-delay:0.30s"><text x="675" y="42" font-size="40" font-weight="700" letter-spacing="-0.8">176</text><text class="m" x="675" y="68" font-size="16">active days this year</text></g>
<clipPath id="r"><rect x="0" y="94" width="900" height="10" rx="5"/></clipPath>
<g clip-path="url(#r)"><rect class="g" x="0.0" y="94" width="345.0" height="10" fill="#f1e05a" style="animation-delay:0.40s"/><rect class="g" x="347.0" y="94" width="215.8" height="10" fill="#3178c6" style="animation-delay:0.48s"/><rect class="g" x="564.9" y="94" width="170.6" height="10" fill="#00ADD8" style="animation-delay:0.56s"/><rect class="g" x="737.4" y="94" width="67.0" height="10" fill="#e34c26" style="animation-delay:0.64s"/><rect class="g" x="806.5" y="94" width="32.4" height="10" fill="#663399" style="animation-delay:0.72s"/><rect class="g" x="840.8" y="94" width="57.2" height="10" fill="#8b949e" style="animation-delay:0.80s"/></g>
<g class="u" style="animation-delay:0.60s"><circle cx="5" cy="132" r="6" fill="#f1e05a"/><text class="m" x="16" y="138" font-size="16">JavaScript 38.6%</text></g><g class="u" style="animation-delay:0.66s"><circle cx="177" cy="132" r="6" fill="#3178c6"/><text class="m" x="188" y="138" font-size="16">TypeScript 24.2%</text></g><g class="u" style="animation-delay:0.72s"><circle cx="348" cy="132" r="6" fill="#00ADD8"/><text class="m" x="359" y="138" font-size="16">Go 19.2%</text></g><g class="u" style="animation-delay:0.78s"><circle cx="451" cy="132" r="6" fill="#e34c26"/><text class="m" x="462" y="138" font-size="16">HTML 7.7%</text></g><g class="u" style="animation-delay:0.84s"><circle cx="562" cy="132" r="6" fill="#663399"/><text class="m" x="573" y="138" font-size="16">CSS 3.8%</text></g><g class="u" style="animation-delay:0.90s"><circle cx="665" cy="132" r="6" fill="#8b949e"/><text class="m" x="676" y="138" font-size="16">Other 6.6%</text></g>
</svg>
