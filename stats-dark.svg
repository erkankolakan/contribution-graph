<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="GitHub stats and most used languages">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}.m{fill:#8b949e}.a{fill:#3fb950}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.u{opacity:0;animation:up .7s cubic-bezier(.22,1,.36,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.u,.g,.c{animation:none;opacity:1;transform:none}}
.g{transform-box:fill-box;transform-origin:0 50%;animation:grow .8s cubic-bezier(.22,1,.36,1) both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
<g class="u" style="animation-delay:0.00s"><text x="0" y="38" font-size="34" font-weight="700" letter-spacing="-0.8">44</text><text class="m" x="0" y="62" font-size="13">best day</text></g><g class="u" style="animation-delay:0.10s"><text x="225" y="38" font-size="34" font-weight="700" letter-spacing="-0.8">15</text><text class="m" x="225" y="62" font-size="13">longest streak, days</text></g><g class="u" style="animation-delay:0.20s"><text x="450" y="38" font-size="34" font-weight="700" letter-spacing="-0.8">4</text><text class="m" x="450" y="62" font-size="13">current streak, days</text></g><g class="u" style="animation-delay:0.30s"><text x="675" y="38" font-size="34" font-weight="700" letter-spacing="-0.8">176</text><text class="m" x="675" y="62" font-size="13">active days this year</text></g>
<clipPath id="r"><rect x="0" y="92" width="900" height="8" rx="4"/></clipPath>
<g clip-path="url(#r)"><rect class="g" x="0.0" y="92" width="346.3" height="8" fill="#f1e05a" style="animation-delay:0.40s"/><rect class="g" x="348.3" y="92" width="216.6" height="8" fill="#3178c6" style="animation-delay:0.48s"/><rect class="g" x="566.9" y="92" width="171.2" height="8" fill="#00ADD8" style="animation-delay:0.56s"/><rect class="g" x="740.2" y="92" width="67.0" height="8" fill="#e34c26" style="animation-delay:0.64s"/><rect class="g" x="809.2" y="92" width="32.5" height="8" fill="#663399" style="animation-delay:0.72s"/><rect class="g" x="843.7" y="92" width="54.3" height="8" fill="#8b949e" style="animation-delay:0.80s"/></g>
<g class="u" style="animation-delay:0.60s"><circle cx="5" cy="128" r="5" fill="#f1e05a"/><text class="m" x="16" y="133" font-size="13">JavaScript 38.7%</text></g><g class="u" style="animation-delay:0.66s"><circle cx="156" cy="128" r="5" fill="#3178c6"/><text class="m" x="167" y="133" font-size="13">TypeScript 24.3%</text></g><g class="u" style="animation-delay:0.72s"><circle cx="307" cy="128" r="5" fill="#00ADD8"/><text class="m" x="318" y="133" font-size="13">Go 19.2%</text></g><g class="u" style="animation-delay:0.78s"><circle cx="401" cy="128" r="5" fill="#e34c26"/><text class="m" x="412" y="133" font-size="13">HTML 7.7%</text></g><g class="u" style="animation-delay:0.84s"><circle cx="502" cy="128" r="5" fill="#663399"/><text class="m" x="513" y="133" font-size="13">CSS 3.8%</text></g><g class="u" style="animation-delay:0.90s"><circle cx="595" cy="128" r="5" fill="#8b949e"/><text class="m" x="606" y="133" font-size="13">Other 6.3%</text></g>
</svg>
